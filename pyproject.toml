[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pasm-medical"
version = "0.1.0"
description = "医院智能诊疗辅助系统的认知服务侧 —— 基于 PASM 引擎的患者级记忆、共情沟通与受控自学习"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "arronzheng" }]
keywords = ["pasm", "medical", "cdss", "cognition", "fhir", "tcm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["pasm-skills>=0.6.2", "pasm-framework>=0.5.3"]

[project.urls]
Homepage = "https://gitee.com/arronzheng/pasm-medical"
Repository = "https://github.com/arronJack/pasm-medical"

[project.scripts]
pasm-medical = "pasm_medical.service:main"
pasm-medical-mcp = "pasm_medical.mcp.server:main"

[tool.setuptools]
packages = ["pasm_medical", "pasm_medical.mcp"]
