# 医院智能诊疗辅助系统 · 后端配置
#
# ⚠️ 认知服务令牌是**管理令牌**：认知接口能写记忆、改人格、触发巩固。
#    绝不要把它写进前端构建产物，也不要提交到仓库。
#    生产请从环境变量注入（下面用 ${...} 占位）。
server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: pasm-medical-backend

  datasource:
    # PostgreSQL（不是 MySQL）：需要 JSONB 存非结构化病历、pgvector 做向量检索、
    # 窗口函数做时序分析。若对接院内既有 HIS/EMR 用的是 MySQL/达梦，需先评估。
    url: ${MEDICAL_DB_URL:jdbc:postgresql://127.0.0.1:5432/pasm_medical}
    username: ${MEDICAL_DB_USER:pasm_medical}
    password: ${MEDICAL_DB_PASSWORD:}
  jpa:
    hibernate:
      # 生产必须是 validate/none —— 医疗系统的表结构变更要走评审与变更单，
      # 绝不能让 ORM 自动改表。
      # 建表由 Flyway 的版本化迁移负责（db/migration/V*.sql），JPA 只校验一致性。
      ddl-auto: validate
    open-in-view: false      # 关掉：避免把 DB 连接绑到视图渲染期

  # ★ 生产库结构 = 版本化迁移（可 diff / 可评审 / 可回放）
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 已有库（例如早期用 ddl-auto 建过表）首次接入 Flyway 时，
    # 以 baseline 标记为 V1，避免 "non-empty schema without history table" 直接拒绝启动。
    # ⚠ 这只解决"能启动"，不解决"结构是否真的对" —— 老库接入前要人工比对一次。
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null

# ── 认知服务（Python / PASM）────────────────────────────────────────────
pasm:
  cognition:
    base-url: ${PASM_COGNITION_URL:http://127.0.0.1:8090}
    # 管理令牌：从环境变量注入，勿入库、勿下发前端
    token: ${PASM_COGNITION_TOKEN:}
    timeout-seconds: 20

# ── 认证 ───────────────────────────────────────────────────────────────
medical:
  auth:
    # ★ 写死的演示账号（staff/patient，密码 123456）默认**关闭**。
    #   开启它等于把演示口令带到生产 —— 所以只有 dev 档显式打开
    #   （见 application-dev.yml）。生产必须接入医院统一身份：
    #   OIDC/OAuth2 或签名 JWT（带过期与刷新），并把患者 ref 作为 claim 绑定进令牌。
    demo-login-enabled: ${MEDICAL_AUTH_DEMO_LOGIN:false}
    # ★ 签名 JWT（HS256）。身份写在令牌声明里，服务端不存会话 → 可水平扩容、重启不掉登录态。
    #   生产必须注入 ≥32 字节随机值（下面留空 = 启动时生成临时密钥并告警，重启后旧令牌失效）。
    #   生成示例：openssl rand -base64 48
    jwt-secret: ${MEDICAL_AUTH_JWT_SECRET:}
    # 令牌有效期（秒），默认 1 小时。上线前按医院安全策略调整。
    jwt-ttl-seconds: ${MEDICAL_AUTH_JWT_TTL:3600}
    jwt-issuer: ${MEDICAL_AUTH_JWT_ISSUER:pasm-medical}

  # ── LIS / FHIR 对接（机器通道）──────────────────────────────────────
  # ★ 与用户令牌**完全分离**：LIS 只该有"投递检验结果"的权限，
  #   给它一个医护 JWT 等于让它能读全院病历。
  # ★ 未配置（空）= 通道关闭（fail closed），不是"不校验"。
  # 生成：openssl rand -base64 48
  lis:
    token: ${MEDICAL_LIS_TOKEN:}

    # ── MLLP over TCP（LIS 直连 2575 + HL7 ACK^R01）──────────────────
    # ★ 默认关闭：现有部署走 HTTP 投递（由集成引擎转发）。只有对接方明确要求
    #   LIS 直连、且强制要 ACK 报文时才打开。开监听端口是很重的决定。
    # ★ 打开后仍 fail closed：仅绑回环、必须配 MEDICAL_LIS_TOKEN、
    #   令牌用 HL7 自定义 ZAT 段承载（TCP 没有 HTTP 头），入库前剥离。
    # ★ 跨机部署不要只改 bind：必须由院方在网络层做白名单/专网隔离，
    #   本项目不代替院方做网络准入。
    mllp:
      enabled: ${MEDICAL_LIS_MLLP_ENABLED:false}
      bind: ${MEDICAL_LIS_MLLP_BIND:127.0.0.1}
      port: ${MEDICAL_LIS_MLLP_PORT:2575}
      read-timeout-ms: ${MEDICAL_LIS_MLLP_READ_TIMEOUT_MS:10000}
      max-connections: ${MEDICAL_LIS_MLLP_MAX_CONNECTIONS:8}

  # ── 影像归档（只归档 + 转交，绝不分析）────────────────────────────
  # ★ 原始字节落本地目录，库里只存相对 key + sha256；服务端不解码图像。
  #   生产必须换成 PACS / MinIO 适配器并补加密、留存与跨主机共享（见 GUIDE）。
  imaging:
    dir: ${MEDICAL_IMAGING_DIR:.demo/imaging}
    # 单文件上限（字节，默认 5 MiB）：避免用 HTTP 接口搬运 DICOM 大文件。
    max-bytes: ${MEDICAL_IMAGING_MAX_BYTES:5242880}

  # ── 自学习审核台（PLAN §8 候选池）──────────────────────────────────
  # 每日批处理默认**关闭**：自动跑会扫全库就诊写候选池，生产应在低峰期手动触发，
  # 或由运维在 supervisor/cron 里按机构节奏触发；避免"忘记配置就自动跑"带来的噪声。
  # 需开启时置 true（并评估对就诊库的压力）。
  learning:
    auto-generate-candidates:
      enabled: ${MEDICAL_LEARNING_AUTO:false}

  # 每次认知调用都要留痕：入参快照 / 召回条目 / 模型版本 / 操作者 / 时间。
  # 生产建议落到**独立库**且只授予 INSERT（append-only），与业务库物理隔离。
  audit:
    enabled: true
    store: db

  # ── 投产门禁启动自检（见 docs/COMPLIANCE-GATE.md）──────────────────
  # 默认 false：只打印门禁报告（WARN），不阻止启动 —— 本仓 dev / 嵌入式 PG
  # 测试 / e2e 共用同一份默认配置，若默认拦死会让一键验证集体起不来。
  # ★ 投产必须置 true：任一 BLOCK 项未过 → 抛异常阻止启动。
  production-gate:
    strict: ${MEDICAL_PRODUCTION_GATE_STRICT:false}

management:
  endpoints:
    web:
      exposure:
        # 生产只暴露 health/info；metrics 走内网或鉴权后
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.pasm.medical: INFO
    # 认知调用链路的调试日志：排查"为什么没召回"时打开
    com.pasm.medical.cognition: INFO
