# 开发档：用 H2 内存库，**不需要任何外部数据库**就能把服务跑起来。
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
# 生产仍走 application.yml 里的 PostgreSQL。
spring:
  datasource:
    url: jdbc:h2:mem:pasm_medical;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # 开发档才允许自动建表。生产必须是 validate/none ——
      # 医疗系统的表结构变更要走评审与变更单，不能让 ORM 自己改表。
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect

logging:
  level:
    com.pasm.medical: DEBUG

medical:
  auth:
    # ★ 仅开发档打开演示账号（staff/123456、patient/123456），让前端与 e2e 能联调。
    #   生产档（application.yml）默认 false —— 忘记配置的后果是"登不进去"（可发现），
    #   而不是"写死的口令跟着上线"（不可发现）。真机上跑 e2e 可用
    #   --medical.auth.demo-login-enabled=false 覆盖，验证关掉之后确实登不进去。
    demo-login-enabled: true
