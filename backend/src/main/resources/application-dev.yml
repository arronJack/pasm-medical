# 开发档：用 H2 内存库，**不需要任何外部数据库**就能把服务跑起来。
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
# 生产仍走 application.yml 里的 PostgreSQL。
spring:
  datasource:
    url: jdbc:h2:mem:pasm_medical;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # ★ dev 也走 Flyway + validate：让 e2e 每次启动都在**同一份迁移脚本**上建表。
      #   若 dev 用 ddl-auto=update、生产用迁移，两套结构会静默漂移 ——
      #   等上线才发现"迁移少一列"就太晚了。
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect

  # ★ dev 与生产**共用同一份迁移**：V1__init.sql 用的是标准 DDL
  #   （TIMESTAMP WITH TIME ZONE / GENERATED BY DEFAULT AS IDENTITY / COMMENT ON），
  #   H2 2.x 可直接执行。这样每次 e2e 启动都在验证"迁移脚本 + JPA validate"这一对，
  #   而不是让 dev 用 ddl-auto=update 悄悄长出一套和生产不同的结构。
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.pasm.medical: DEBUG

medical:
  auth:
    # ★ 仅开发档打开演示账号（staff/123456、patient/123456），让前端与 e2e 能联调。
    #   生产档（application.yml）默认 false —— 忘记配置的后果是"登不进去"（可发现），
    #   而不是"写死的口令跟着上线"（不可发现）。真机上跑 e2e 可用
    #   --medical.auth.demo-login-enabled=false 覆盖，验证关掉之后确实登不进去。
    demo-login-enabled: true
